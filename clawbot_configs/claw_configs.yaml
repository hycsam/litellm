# OpenClaw Auto-Router Proxy Config
#
# Routes requests to different models based on semantic intent:
#   - Heartbeat / health checks -> local ollama (fast, free)
#   - Coding tasks -> OpenRouter (kimi-k2, deepseek-v4, codex) with load balancing
#   - Skill/tool usage -> GPT-4o-mini (via OpenRouter)
#   - Vision (image/video recognition, image generation) -> Gemini 2.5 Flash
#   - Video generation -> Seedance 2.0 Fast (via OpenRouter)
#   - General (fallback) -> Gemini 2.5 Flash
#
# Usage:
#   litellm --config routing_configs/config.yaml
#
# Client calls:
#   POST /v1/chat/completions { "model": "openclaw-router", ... }

model_list:
  # ─── Auto-Router Entry Point ───
  - model_name: openclaw-router
    litellm_params:
      model: auto_router/semantic
      auto_router_config: |
        {
          "routes": [
            {
              "name": "heartbeat",
              "description": "Health checks, pings, keep-alive, status checks",
              "utterances": [
                "Heartbeat: OpenClaw system health check.",
                "ping",
                "pong",
                "heartbeat",
                "health check",
                "status check",
                "are you alive",
                "are you there",
                "are you online",
                "system status",
                "connection test",
                "keep alive",
                "keepalive",
                "ready check",
                "liveness probe",
                "readiness probe",
                "echo",
                "noop",
                "ack"
              ],
              "score_threshold": 0.4
            }
          ]
        }
      auto_router_default_model: general
      auto_router_embedding_model: ollama/nomic-embed-text

  # ─── Embedding Model (used by the router itself) ───
  - model_name: ollama/nomic-embed-text
    litellm_params:
      # model: ollama/nomic-embed-text
      # api_base: http://host.docker.internal:11434
      model: openai/nomic-embed-text # 强制 LiteLLM 使用标准输入格式
      api_base: "http://host.docker.internal:11434/v1"
      api_key: "sk-not-needed"

  # ─── Heartbeat -> OpenRouter Gemini 2.5 Flash Lite ───
  - model_name: heartbeat
    litellm_params:
      model: openrouter/google/gemini-2.5-flash-lite
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openrouter_auto
    litellm_params:
      model: openrouter/auto
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: general
    litellm_params:
      model: anthropic/claude-haiku
      api_key: os.environ/ANTHROPIC_API_KEY
      api_base: http://Sams-MacBook-Pro.local:4000

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
