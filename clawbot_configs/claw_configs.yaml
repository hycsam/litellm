# OpenClaw Auto-Router Proxy Config
#
# Routes requests to different models based on semantic intent:
#   - Heartbeat / health checks -> local ollama (fast, free)
#   - Coding tasks -> OpenRouter (kimi-k2, deepseek-v4, codex) with load balancing
#   - Skill/tool usage -> GPT-4o-mini (via OpenRouter)
#   - Vision (image/video recognition, image generation) -> Gemini 2.5 Flash
#   - Video generation -> Seedance 2.0 Fast (via OpenRouter)
#   - General (fallback) -> Gemini 2.5 Flash
#
# Usage:
#   litellm --config routing_configs/config.yaml
#
# Client calls:
#   POST /v1/chat/completions { "model": "openclaw-router", ... }

model_list:
  # ─── Auto-Router Entry Point ───
  - model_name: openclaw-router
    litellm_params:
      model: auto_router/semantic
      auto_router_config: |
        {
          "routes": [
            {
              "name": "heartbeat",
              "description": "Health checks, pings, keep-alive, status checks",
              "utterances": [
                "Heartbeat: OpenClaw system health check.",
                "ping",
                "pong",
                "heartbeat",
                "health check",
                "status check",
                "are you alive",
                "are you there",
                "are you online",
                "system status",
                "connection test",
                "keep alive",
                "keepalive",
                "ready check",
                "liveness probe",
                "readiness probe",
                "echo",
                "noop",
                "ack"
              ],
              "score_threshold": 0.4
            },
            {
              "name": "coding",
              "description": "Code generation, debugging, programming, implementation tasks",
              "utterances": [
                "write a function that sorts an array",
                "implement a binary search algorithm",
                "debug this TypeError in my code",
                "fix this null pointer exception",
                "refactor this class to use dependency injection",
                "write unit tests for this module",
                "add integration tests for the API",
                "create a python script that processes CSV files",
                "optimize this SQL query for performance",
                "review this pull request for issues",
                "explain what this recursive function does",
                "write a bash script to deploy the app",
                "create a REST API endpoint for user registration",
                "add proper error handling and retries",
                "convert this JavaScript to TypeScript",
                "write a Dockerfile for this Node.js app",
                "set up GitHub Actions CI/CD pipeline",
                "parse this JSON response and extract fields",
                "write a regex to validate email addresses",
                "design a database schema for an e-commerce app",
                "implement authentication middleware",
                "create a WebSocket handler for real-time updates",
                "write a data migration script",
                "build a CLI tool with argument parsing",
                "implement rate limiting for this endpoint",
                "add pagination to this list API",
                "write a custom React hook for form validation",
                "set up logging and error tracking",
                "implement a caching layer with Redis",
                "create a GraphQL resolver for this type",
                "write a Kubernetes deployment manifest",
                "implement retry logic with exponential backoff",
                "refactor this monolith into microservices",
                "write a load test with k6",
                "add OpenAPI documentation to this endpoint"
              ],
              "score_threshold": 0.3
            },
            {
              "name": "skill",
              "description": "Tool usage, skill execution, agent actions, workflow orchestration",
              "utterances": [
                "search for all Python files in this project",
                "read the contents of config.yaml",
                "write this output to results.txt",
                "list all files in the src directory",
                "run the test suite and report failures",
                "open this URL and extract the main content",
                "fetch the latest data from this API",
                "find and replace all occurrences in this folder",
                "check the git log for recent changes",
                "look up the documentation for this library",
                "scan this directory for large files",
                "download this file and save it locally",
                "monitor this process and alert if it crashes",
                "compare these two files and show differences",
                "extract text from this PDF document",
                "compress these files into a zip archive",
                "check if this port is open",
                "look at the environment variables",
                "search the web for recent articles about",
                "summarize the contents of this folder",
                "calculate the disk usage of this directory",
                "verify the SSL certificate for this domain",
                "parse this log file for error patterns",
                "execute this shell command and capture output",
                "create a new branch and switch to it",
                "stage these changes and commit them",
                "install this skill from the registry",
                "add a new skill to my agent",
                "set up the web browsing skill",
                "configure the database skill",
                "enable the code execution skill",
                "install the file management plugin",
                "register a new tool for the agent",
                "update this skill to the latest version",
                "uninstall this skill",
                "list all installed skills"
              ],
              "score_threshold": 0.3
            },
            {
              "name": "vision",
              "description": "Image recognition, image generation, video recognition, visual content analysis",
              "utterances": [
                "what is in this image",
                "describe this picture",
                "analyze this screenshot",
                "what do you see in this photo",
                "read the text in this image",
                "extract data from this chart",
                "identify the objects in this image",
                "what is happening in this video",
                "summarize this video clip",
                "describe the scene in this frame",
                "is there any text visible in this",
                "compare these two images",
                "what color is the object in this photo",
                "count the items in this image",
                "transcribe the whiteboard in this photo",
                "what does this diagram show",
                "explain this flowchart",
                "read this handwritten note",
                "identify the brand or logo in this image",
                "what is wrong with the UI in this screenshot",
                "describe the layout of this page",
                "what species is this animal",
                "analyze this medical scan",
                "what is the emotion on this person face",
                "describe the architecture in this photo",
                "generate an image of a sunset over mountains",
                "create a picture of a cat wearing a hat",
                "draw a diagram of this system",
                "make an illustration for this concept",
                "generate a logo for my brand",
                "create a thumbnail for this video",
                "recognize the faces in this photo",
                "what does this video show"
              ],
              "score_threshold": 0.3
            },
            {
              "name": "video_generation",
              "description": "Video generation, video creation, animation, motion synthesis",
              "utterances": [
                "generate a video of a dog running on the beach",
                "create a video from this image",
                "animate this still photo",
                "make a video clip of rain falling",
                "generate a short video of a sunrise",
                "create an animation of particles flowing",
                "turn this image into a video",
                "generate a video of clouds moving",
                "make a video of a person walking",
                "create a timelapse video",
                "animate this character",
                "generate a product demo video",
                "create a motion video from this prompt",
                "make a cinematic video of a city skyline",
                "generate a video ad for this product",
                "create a video of water flowing",
                "animate this drawing",
                "generate a 5-second video clip",
                "make a video of fire burning",
                "create a slow-motion video effect"
              ],
              "score_threshold": 0.3
            }
          ]
        }
      auto_router_default_model: general
      auto_router_embedding_model: ollama/nomic-embed-text

  # ─── Embedding Model (used by the router itself) ───
  - model_name: ollama/nomic-embed-text
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://host.docker.internal:11434

  # ─── Heartbeat -> Local Ollama ───
  - model_name: heartbeat
    litellm_params:
      model: ollama/heartbeat-llama3.2
      api_base: http://host.docker.internal:11434

  # ─── Coding -> OpenRouter (load-balanced across 3 models) ───
  - model_name: coding
    litellm_params:
      model: openrouter/moonshotai/kimi-k2.6
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: coding
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-pro
      api_key: os.environ/OPENROUTER_API_KEY

  # - model_name: coding
  #   litellm_params:
  #     model: openrouter/openai/gpt-5.3-codex
  #     api_key: os.environ/OPENROUTER_API_KEY

  # ─── Skill -> GPT-4o-mini (via OpenRouter) ───
  - model_name: skill
    litellm_params:
      model: openrouter/openai/gpt-4o-mini
      api_key: os.environ/OPENROUTER_API_KEY

  # ─── Vision (image recognition/generation, video recognition) -> Gemini 2.5 Flash ───
  - model_name: vision
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  # ─── Video Generation -> Seedance 2.0 Fast (via OpenRouter) ───
  - model_name: video_generation
    litellm_params:
      model: openrouter/bytedance/seedance-2.0-fast
      api_key: os.environ/OPENROUTER_API_KEY

  # ─── General (default fallback) -> Gemini 2.5 Flash ───
  - model_name: general
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
